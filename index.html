<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Helfy Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#000;--fg:#fff;--card:rgba(10,10,10,.88);--line:rgba(255,255,255,.2);--dim:rgba(255,255,255,.6)}
body.light{--bg:#fff;--fg:#000;--card:rgba(255,255,255,.9);--line:rgba(0,0,0,.2);--dim:rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;transition:background .4s,color .4s}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-tile{filter:invert(1) grayscale(1) brightness(.9);transition:filter .4s}
body.light .leaflet-tile{filter:grayscale(1)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;font-size:14px}
button{font:inherit;font-size:14px;font-weight:600;height:44px;border-radius:22px;border:0;padding:0 16px;background:var(--fg);color:var(--bg);transition:transform .15s,opacity .2s}
button:active{transform:scale(.93)}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
#top{position:absolute;z-index:999;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;animation:down .7s cubic-bezier(.2,.9,.3,1) both}
#q{flex:1;min-width:0;height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);color:var(--fg);font-size:16px;outline:0}
#q::placeholder{color:var(--dim)}
#theme{flex:none;height:46px;background:var(--card);color:var(--fg);border:1px solid var(--line);backdrop-filter:blur(14px)}
.list{position:absolute;z-index:1000;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 66px);background:var(--bg);border:1px solid var(--line);border-radius:18px;max-height:50%;overflow:auto;display:none}
.list.show{display:block;animation:down .3s both}
.list div{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
.list div:last-child{border:0}
#guide{position:absolute;z-index:998;top:calc(env(safe-area-inset-top) + 66px);left:12px;right:12px;padding:16px;border-radius:24px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);text-align:center;display:none}
#guide.show{display:block;animation:down .5s cubic-bezier(.2,.9,.3,1) both}
#cmd{font-size:54px;font-weight:800;letter-spacing:2px;line-height:1.1}
#cmd.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
#cmd.miss{color:#ff4d4d}
#info{color:var(--dim);margin:6px 0 14px}
#sheet{position:absolute;z-index:999;left:0;right:0;bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom) + 10px);background:var(--card);backdrop-filter:blur(16px);border-radius:26px 26px 0 0;border-top:1px solid var(--line);animation:up .8s cubic-bezier(.2,.9,.3,1) both}
#place{font-size:20px;font-weight:700;line-height:1.2;max-height:2.4em;overflow:hidden}
#coords{font-size:12px;color:var(--dim);margin:4px 0 14px}
.row{display:flex;gap:8px}.row button{flex:1;padding:0}
#credit{font-size:10px;color:var(--dim);text-align:center;margin-top:10px}
.me{width:18px;height:18px;border-radius:50%;background:var(--fg);border:3px solid var(--bg);position:relative}
.me::after,.dest::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--fg);animation:pulse 2s ease-out infinite}
.dest{width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--fg);position:relative;animation:drop .6s cubic-bezier(.2,1.5,.4,1)}
.route{stroke:var(--fg);stroke-width:5;stroke-dasharray:1 12;stroke-linecap:round;fill:none;animation:dash 1s linear infinite}
@keyframes up{from{transform:translateY(110%)}}
@keyframes down{from{transform:translateY(-30px);opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:.2}}
@keyframes drop{from{transform:translateY(-30px) scale(.4);opacity:0}}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(3);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-13}}
</style></head><body>
<div id="map"></div>
<div id="top"><input id="q" placeholder="Search place" enterkeyhint="search"><button id="theme">Theme</button></div>
<div id="results" class="list"></div><div id="saved" class="list"></div>
<div id="guide"><div id="cmd">...</div><div id="info"></div><button id="stop" class="ghost" style="width:100%">Stop</button></div>
<div id="sheet">
 <div id="place">Finding you...</div><div id="coords"></div>
 <div class="row"><button id="follow">Follow</button><button id="save" class="ghost">Save</button><button id="list" class="ghost">Places</button><button id="dl" class="ghost">Offline</button></div>
 <div id="credit">Map data © OpenStreetMap contributors</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
const $=id=>document.getElementById(id);
// theme
function applyTheme(l){document.body.classList.toggle('light',l);document.querySelector('meta[name=theme-color]').content=l?'#ffffff':'#000000';}
let isLight=false;try{isLight=localStorage.getItem('helfy_theme')==='light';}catch(_){}
applyTheme(isLight);
$('theme').onclick=()=>{isLight=!isLight;applyTheme(isLight);try{localStorage.setItem('helfy_theme',isLight?'light':'dark');}catch(_){}};
// map (no Leaflet badge; OSM credit is in the bottom card)
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([20,0],2);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let me=null,meMarker=null,acc=null,follow=true,dest=null,destMarker=null,routeLine=null,route=[],heading=null,last=null,minD=Infinity,lastSpoken='',lastSpokeAt=0,speedAvg=1.4,lastNameAt=0;
const meIcon=L.divIcon({html:'<div class="me"></div>',iconSize:[18,18],className:''});
const destIcon=L.divIcon({html:'<div class="dest"></div>',iconSize:[20,20],className:''});
const R=6371000,rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
function dist(a,b){const dLa=rad(b.lat-a.lat),dLo=rad(b.lng-a.lng);const x=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (deg(Math.atan2(y,x))+360)%360;}
const fmtD=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km';
const fmtT=s=>s<60?'under 1 min':Math.round(s/60)+' min';
const saved=()=>{try{return JSON.parse(localStorage.getItem('helfy_places')||'[]');}catch(_){return[];}};
const nameCache={};
async function placeName(p){
  if(navigator.onLine){
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&lat=${p.lat}&lon=${p.lng}`);const j=await r.json();const out=j.display_name||j.name||'';if(out){nameCache[p.lat.toFixed(3)+p.lng.toFixed(3)]=out;return out;}}catch(e){}
  }
  const near=saved().map(s=>({...s,d:dist(p,s)})).sort((a,b)=>a.d-b.d)[0];
  if(near&&near.d<300)return 'Near '+near.name;
  return nameCache[p.lat.toFixed(3)+p.lng.toFixed(3)]||'Offline: '+p.lat.toFixed(4)+', '+p.lng.toFixed(4);
}
// GPS
navigator.geolocation.watchPosition(pos=>{
  const c=pos.coords,p={lat:c.latitude,lng:c.longitude};
  if(last){const d=dist(last,p);if(d>3)heading=bearing(last,p);const dt=(pos.timestamp-last.t)/1000;if(dt>0&&d/dt>0.5)speedAvg=speedAvg*.8+(d/dt)*.2;}
  if(c.heading!=null&&!isNaN(c.heading)&&c.speed>1)heading=c.heading;
  last={...p,t:pos.timestamp};me=p;
  if(!meMarker){meMarker=L.marker(p,{icon:meIcon,interactive:false}).addTo(map);acc=L.circle(p,{radius:c.accuracy,weight:1,color:'#888',fillOpacity:.08}).addTo(map);map.flyTo(p,17,{duration:2});}
  meMarker.setLatLng(p);acc.setLatLng(p).setRadius(c.accuracy);
  if(follow)map.panTo(p,{animate:true,duration:.8});
  $('coords').textContent=`${navigator.onLine?'':'Offline · '}${p.lat.toFixed(5)}, ${p.lng.toFixed(5)} · ${Math.round((c.speed||0)*3.6)} km/h`;
  if(Date.now()-lastNameAt>8000){lastNameAt=Date.now();placeName(p).then(n=>$('place').textContent=n);}
  if(dest&&$('guide').classList.contains('show'))guide();
},err=>{$('place').textContent='Please allow location';$('coords').textContent=err.message;},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
map.on('dragstart',()=>{follow=false;$('follow').textContent='Follow';});
$('follow').onclick=()=>{follow=true;if(me)map.flyTo(me,Math.max(map.getZoom(),16),{duration:1});$('follow').textContent='Following';};
// search
const hideLists=()=>{$('results').classList.remove('show');$('saved').classList.remove('show');};
$('q').addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;const box=$('results');hideLists();box.classList.add('show');
  if(!navigator.onLine){box.innerHTML='<div>Offline. Use Places for saved spots.</div>';return;}
  box.innerHTML='<div>Searching...</div>';
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent($('q').value));const j=await r.json();
  box.innerHTML='';j.forEach(x=>{const d=document.createElement('div');d.textContent=x.display_name;d.onclick=()=>{hideLists();$('q').blur();map.flyTo([+x.lat,+x.lon],16,{duration:1.5});pick({lat:+x.lat,lng:+x.lon},x.display_name);};box.appendChild(d);});
  if(!j.length)box.innerHTML='<div>No results</div>';}catch(_){box.innerHTML='<div>Search failed</div>';}
});
// saved places
$('save').onclick=async()=>{const p=dest||me;if(!p)return;const n=prompt('Name this place:',(await placeName(p)).split(',')[0]);if(!n)return;const s=saved();s.push({name:n,lat:p.lat,lng:p.lng});localStorage.setItem('helfy_places',JSON.stringify(s));};
$('list').onclick=()=>{const b=$('saved');if(b.classList.contains('show')){hideLists();return;}hideLists();b.innerHTML='';const s=saved();
  if(!s.length)b.innerHTML='<div>No saved places yet</div>';
  else{const h=document.createElement('div');h.style.cssText='font-size:12px;color:var(--dim)';h.textContent='Tap to open. Hold to delete.';b.appendChild(h);}
  s.forEach((x,i)=>{const d=document.createElement('div');d.textContent=x.name;d.onclick=()=>{hideLists();map.flyTo([x.lat,x.lng],16,{duration:1.5});pick(x,x.name);};d.oncontextmenu=e=>{e.preventDefault();if(confirm('Delete '+x.name+'?')){s.splice(i,1);localStorage.setItem('helfy_places',JSON.stringify(s));hideLists();}};b.appendChild(d);});
  b.classList.add('show');};
// destination
map.on('click',e=>{hideLists();pick({lat:e.latlng.lat,lng:e.latlng.lng},null);});
async function pick(p,name){
  dest=p;if(destMarker)destMarker.remove();
  destMarker=L.marker(p,{icon:destIcon}).addTo(map);
  const wrap=document.createElement('div');wrap.innerHTML='<b>Loading...</b><br>';
  const b=document.createElement('button');b.textContent='Go here';b.style.cssText='margin-top:8px;height:38px;width:100%';b.onclick=()=>startGuide();wrap.appendChild(b);
  destMarker.bindPopup(wrap).openPopup();
  const n=name||await placeName(p);wrap.firstChild.textContent=n.split(',').slice(0,2).join(',');
}
async function startGuide(){
  map.closePopup();if(!me||!dest)return;minD=Infinity;route=[];if(routeLine)routeLine.remove();
  $('guide').classList.add('show');setCmd('...','');$('info').textContent='Finding route...';
  if(navigator.onLine){
    try{const r=await fetch(`https://router.project-osrm.org/route/v1/foot/${me.lng},${me.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson`);const j=await r.json();
    if(j.routes&&j.routes[0]){route=j.routes[0].geometry.coordinates.map(c=>({lat:c[1],lng:c[0]}));routeLine=L.polyline(route,{className:'route',interactive:false}).addTo(map);}}catch(_){}
  }
  follow=true;$('follow').textContent='Following';guide();
}
$('stop').onclick=()=>{dest=null;route=[];if(routeLine)routeLine.remove();if(destMarker)destMarker.remove();$('guide').classList.remove('show');try{speechSynthesis.cancel();}catch(_){}};
// guidance: left / right / forward / miss
function setCmd(text,cls){const c=$('cmd');const changed=c.textContent!==text;c.textContent=text;c.className=cls;if(changed){void c.offsetWidth;c.classList.add('pop');}}
function guide(){
  if(!me||!dest)return;
  const dDest=dist(me,dest);
  if(dDest<20){say('ARRIVED','arrived','You arrived');$('info').textContent='You are here';return;}
  if(dDest<minD)minD=dDest;
  let target=dest,remain=dDest;
  if(route.length>1){
    let bi=0,bd=Infinity;route.forEach((p,i)=>{const d=dist(me,p);if(d<bd){bd=d;bi=i;}});
    let j=bi;while(j<route.length-1&&dist(me,route[j])<25)j++;target=route[j];
    remain=dist(me,route[bi]);for(let k=bi;k<route.length-1;k++)remain+=dist(route[k],route[k+1]);
  }
  $('info').textContent=`${fmtD(remain)} · ${fmtT(remain/Math.max(speedAvg,0.8))}${route.length?'':' · straight line'}`;
  if(minD<60&&dDest>minD+40){say('MISS','miss','Miss. You passed the place');return;}
  if(heading==null){setCmd('MOVE','');return;}
  const diff=((bearing(me,target)-heading+540)%360)-180;
  if(Math.abs(diff)<25)say('FORWARD','forward','Forward');
  else if(diff>0)say('RIGHT','right','Right');
  else say('LEFT','left','Left');
}
function say(text,cls,speech){
  setCmd(text,cls);
  const now=Date.now();
  if(speech!==lastSpoken||now-lastSpokeAt>15000){
    if(speech===lastSpoken&&now-lastSpokeAt<4000)return;
    lastSpoken=speech;lastSpokeAt=now;
    try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(speech));}catch(_){}
  }
}
// offline map download (current view)
$('dl').onclick=async()=>{
  if(!navigator.onLine){alert('Go online to download maps.');return;}
  const b=map.getBounds(),z0=Math.max(Math.round(map.getZoom())-1,10),z1=Math.min(z0+3,17),urls=[];
  for(let z=z0;z<=z1;z++){const t=(lat,lng)=>({x:Math.floor((lng+180)/360*2**z),y:Math.floor((1-Math.log(Math.tan(rad(lat))+1/Math.cos(rad(lat)))/Math.PI)/2*2**z)});
    const a=t(b.getNorth(),b.getWest()),c=t(b.getSouth(),b.getEast());
    for(let x=a.x;x<=c.x;x++)for(let y=a.y;y<=c.y;y++)urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);}
  if(urls.length>300){alert('Area too big. Zoom in and try again.');return;}
  const cache=await caches.open('helfy-runtime-v1');let n=0;
  for(const u of urls){try{if(!(await cache.match(u)))await cache.add(u);}catch(_){}n++;$('dl').textContent=n+'/'+urls.length;}
  $('dl').textContent='Offline';alert('Saved for offline use.');
};
</script></body></html>
